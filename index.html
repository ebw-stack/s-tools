<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매대행 마진 계산기</title>
    <style>
        body {
            font-family: "나눔고딕", Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        h2 {
            font-size: 16px;
            margin: 0 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #ddd;
        }
        .section {
            background-color: #fafafa;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section.settings {
            background-color: #f8f8f8;
            border-color: #ddd;
        }
        .section.input-area {
            background-color: #f0f4ff;
            border-color: #ccd6ee;
        }
        label {
            font-size: 14px;
            margin-bottom: 3px;
            display: block;
            font-weight: bold;
        }
        input, select {
            font-size: 16px;
            padding: 8px;
            width: 100%;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
        .row-3 {
            display: flex;
            gap: 8px;
        }
        .row-3 > div {
            flex: 1;
        }
        .result-row {
            display: flex;
            gap: 0;
            margin-top: 4px;
        }
        .result-row > div {
            flex: 1;
            text-align: left;
            min-width: 0;
        }
        .country-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 4px;
        }
        .country-label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .margin-rate {
            font-size: 11px;
            color: #888;
        }
        .margin-rate.red { color: red; }
        .margin-rate.blue { color: blue; }
        .result {
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            min-height: 22px;
            padding: 4px 0;
            word-break: keep-all;
            white-space: nowrap;
        }
        .result.red { color: red; }
        .result.blue { color: blue; }
        .result.gray { color: #999; font-size: 12px; white-space: normal; }
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .nav a {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ddd;
            color: #555;
            background-color: #f8f8f8;
            transition: background-color 0.2s;
        }
        .nav a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .nav a:not(.active):hover {
            background-color: #e9ecef;
        }
        .adjusted-price-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: normal;
            color: #999;
            margin-left: 6px;
            cursor: default;
        }
        .adjusted-price-tag.active {
            color: #007bff;
            cursor: pointer;
        }
        .adjusted-price-tag.active:hover {
            color: #0056b3;
        }
        .adjusted-price-tag .copy-feedback {
            font-size: 11px;
            color: #28a745;
        }
        .reset-button {
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            margin-top: 5px;
            transition: background-color 0.3s ease;
        }
        .reset-button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>구매대행 마진 계산기</h1>

        <div class="nav" id="nav"></div>

        <!-- 환율 설정 -->
        <div class="section settings" id="rateSettings" style="display:none;">
            <h2>환율 설정</h2>
            <div class="row-3">
                <div>
                    <label for="usRate">🇺🇸 미국</label>
                    <select id="usRate" onchange="calculateUS()"></select>
                </div>
                <div>
                    <label for="deRate">🇩🇪 독일</label>
                    <select id="deRate" onchange="calculateDE()"></select>
                </div>
                <div>
                    <label for="ukRate">🇬🇧 영국</label>
                    <select id="ukRate" onchange="calculateUK()"></select>
                </div>
            </div>
        </div>

        <!-- 입력 -->
        <div class="section input-area">
            <h2>입력</h2>
            <div class="row">
                <div style="flex:2;">
                    <div class="row" style="gap:4px; align-items:center;">
                        <div style="flex:3;"><label for="sellingPrice">판매가 (원) <span id="adjustedPriceTag" class="adjusted-price-tag" onclick="copyAdjustedPrice()"></span></label></div>
                        <div style="flex:1;"><label for="baseQty">수량</label></div>
                    </div>
                    <div class="row" style="gap:4px;">
                        <div style="flex:3;"><input type="text" id="sellingPrice" tabindex="1" placeholder="판매가" oninput="formatInput(this); calculateAll()"></div>
                        <div style="flex:1;"><input type="text" id="baseQty" tabindex="2" value="1" placeholder="1" oninput="sanitizeInput(this); calculateAll()" style="text-align:center;"></div>
                    </div>
                </div>
                <div style="flex:1;">
                    <label for="weight">무게 (kg)</label>
                    <select id="weight" tabindex="3" onchange="calculateAll()"></select>
                </div>
            </div>
            <div class="row-3">
                <div>
                    <div class="row" style="gap:4px; align-items:center;">
                        <div style="flex:2;"><label>🇺🇸 현지가 ($)</label></div>
                        <div style="flex:1;"><label>수량</label></div>
                    </div>
                    <div class="row" style="gap:4px;">
                        <div style="flex:2;"><input type="text" id="usPrice" tabindex="4" placeholder="$" oninput="sanitizeInput(this); calculateUS()"></div>
                        <div style="flex:1;"><input type="text" id="usQty" tabindex="5" value="1" oninput="sanitizeInput(this); calculateUS()"></div>
                    </div>
                </div>
                <div>
                    <div class="row" style="gap:4px; align-items:center;">
                        <div style="flex:2;"><label>🇩🇪 현지가 (€)</label></div>
                        <div style="flex:1;"><label>수량</label></div>
                    </div>
                    <div class="row" style="gap:4px;">
                        <div style="flex:2;"><input type="text" id="dePrice" tabindex="6" placeholder="€" oninput="sanitizeInput(this); calculateDE()"></div>
                        <div style="flex:1;"><input type="text" id="deQty" tabindex="7" value="1" oninput="sanitizeInput(this); calculateDE()"></div>
                    </div>
                </div>
                <div>
                    <div class="row" style="gap:4px; align-items:center;">
                        <div style="flex:2;"><label>🇬🇧 현지가 (£)</label></div>
                        <div style="flex:1;"><label>수량</label></div>
                    </div>
                    <div class="row" style="gap:4px;">
                        <div style="flex:2;"><input type="text" id="ukPrice" tabindex="8" placeholder="£" oninput="sanitizeInput(this); calculateUK()"></div>
                        <div style="flex:1;"><input type="text" id="ukQty" tabindex="9" value="1" oninput="sanitizeInput(this); calculateUK()"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 결과 -->
        <div class="section">
            <h2>예상 마진</h2>
            <div class="result-row">
                <div>
                    <div class="country-header">
                        <span class="country-label">🇺🇸 미국</span>
                        <span id="usRate2" class="margin-rate"></span>
                    </div>
                    <div id="usResult" class="result"></div>
                </div>
                <div>
                    <div class="country-header">
                        <span class="country-label">🇩🇪 독일</span>
                        <span id="deRate2" class="margin-rate"></span>
                    </div>
                    <div id="deResult" class="result"></div>
                </div>
                <div>
                    <div class="country-header">
                        <span class="country-label">🇬🇧 영국</span>
                        <span id="ukRate2" class="margin-rate"></span>
                    </div>
                    <div id="ukResult" class="result"></div>
                </div>
            </div>
        </div>

        <button class="reset-button" tabindex="10" onclick="resetFields()">리셋</button>
    </div>

    <script src="js/nav.js?v=1"></script>
    <script src="js/data.js?v=1"></script>
    <script src="js/utils.js?v=6"></script>
    <script src="js/calculator.js?v=3"></script>
    <script src="js/app.js?v=3"></script>

</body>
</html>
